name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check ES modules
        run: |
          set -e
          for f in js/*.js; do
            cp "$f" _check.mjs
            node --check _check.mjs
            rm _check.mjs
          done
      - name: Unit tests (analyzer, validator, query engine, composer)
        run: node --test tools/analyze.test.mjs tools/validate.test.mjs tools/query.test.mjs
      - name: Demo map generates from this repo
        run: |
          node tools/gen-demo.mjs /tmp/self.archmap.json
          node -e "const d=require('/tmp/self.archmap.json'); if(!d.nodes.length||!d.edges.length) process.exit(1)"
      - name: Static assets present
        run: |
          test -f index.html
          test -f css/style.css
          test -f demo/self.archmap.json
          test -f skill/architecture-map/SKILL.md
